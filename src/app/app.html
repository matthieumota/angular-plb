<h1>{{ title }}</h1>

@if (pizza(); as pizza) {
  <h2>{{ pizza.name }}</h2>
  <img [src]="pizza.image" [alt]="pizza.name">
  <p>Prix: {{ pizza.price }}</p>
  <input [(ngModel)]="pizza.name" class="border border-gray-400">
  <input [value]="pizza.name" (input)="pizza.name = $event.target.value" class="border border-gray-400">
}

<app-pizza-selected [pizza]="pizza()" />

<div class="max-w-5xl mx-auto">
  <ul class="grid grid-cols-2 lg:grid-cols-4 gap-8 mt-6">
    @for (pizza of pizzas(); track pizza.id;) {
      <li
        class="cursor-pointer"
        (click)="onSelect(pizza)"
        [ngClass]="{
          'border': this.pizza() === pizza,
          'border-red-500': this.pizza() === pizza && pizza.id === 1,
          'border-blue-500': this.pizza() === pizza && pizza.id === 2,
        }"
      >
        <span>{{ pizza.id }}: {{ pizza.name }}</span>
        <img
          class="hover:opacity-50 duration-300"
          [class.opacity-50]="this.pizza() === pizza"
          [src]="pizza.image"
          [alt]="pizza.name"
        >
      </li>
    }
  </ul>
</div>

<div class="flex gap-8">
  <app-counter />
  <app-counter [initialValue]="5" />
</div>
