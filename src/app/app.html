<h1>{{ title }}</h1>
<h2>{{ messageService.count() }}</h2>

<nav>
  <a routerLink="/">Accueil</a>
  <a routerLink="/pizzas">Pizzas</a>
</nav>

<router-outlet />

<div class="flex gap-8">
  <app-counter />
  <app-counter [initialValue]="5" />
</div>

<div class="max-w-md mx-auto mt-6 rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
  <h2 class="mb-3 text-sm font-semibold text-gray-700">Messages</h2>

  <div class="mb-3 flex gap-2">
    <button
      (click)="addMessage()"
      class="rounded bg-blue-500 px-3 py-1 text-sm text-white hover:bg-blue-600"
    >
      Envoyer
    </button>
  </div>

  <ul class="space-y-2">
    @for (message of messageService.getMessages(); track message; let i = $index) {
      <li class="flex items-center justify-between gap-2 rounded border border-gray-100 bg-gray-50 px-3 py-2 text-sm">
        <span class="flex items-center gap-2">
          <span
            class="rounded-full px-2 py-0.5 text-xs font-medium"
            [ngClass]="{
              'bg-blue-100 text-blue-700': message.type === 'info',
              'bg-green-100 text-green-700': message.type === 'success',
              'bg-yellow-100 text-yellow-700': message.type === 'warning',
              'bg-red-100 text-red-700': message.type === 'error',
            }"
          >
            {{ message.type }}
          </span>
          <span class="text-gray-800">{{ message.text }}</span>
        </span>
        <button (click)="messageService.removeMessage(i)" class="text-xs text-gray-400 hover:text-red-500">
          Supprimer
        </button>
      </li>
    } @empty {
      <li class="text-sm text-gray-400">Aucun message</li>
    }
  </ul>
</div>
