@if (pizza(); as pizza) {
  <div class="max-w-5xl mx-auto">
    <h1>{{ pizza.name }}</h1>
    <img [src]="pizza.image" [alt]="pizza.name" class="object-cover rounded">

    <a [routerLink]="['/pizzas', pizza.id, 'edit']">Modifier la pizza</a>
  </div>
}

@if (hasError()) {
  <h1>La pizza n'existe pas</h1>
}
