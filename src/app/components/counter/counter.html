<div class="inline-flex items-center gap-3">
  <button
    class="h-7 w-7 rounded border border-gray-300 text-gray-600 hover:bg-gray-100 disabled:opacity-30 disabled:hover:bg-transparent"
    [disabled]="value() === 0"
    (click)="decrement()"
  >
    -
  </button>

  <span class="w-4 text-center text-sm text-gray-800">{{ value() }}</span>
  <p class="text-xs">Le compteur commence a {{ initialValue() }}</p>

  @if (value() < 10) {
    <button
      class="h-7 w-7 rounded border border-gray-300 text-gray-600 hover:bg-gray-100"
      (click)="increment()"
    >
      +
    </button>
  }
</div>
