@if (pizza(); as pizza) {
  <div class="flex flex-col items-center gap-2 text-center">
    <h2>{{ pizza.name }}</h2>
    <img [src]="pizza.image" [alt]="pizza.name" class="w-32 h-32 object-cover rounded">
    <p>Prix: {{ pizza.price }}</p>
    <input [(ngModel)]="pizza.name" class="border border-gray-400">
    <input [value]="pizza.name" (input)="pizza.name = $event.target.value" class="border border-gray-400">
  </div>
}
